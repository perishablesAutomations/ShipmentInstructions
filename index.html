<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instrucciones Perecederos · Kuehne+Nagel</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="login-shell">
  <div class="login-card">
    <div class="brand-mark">Instrucciones Perecederos</div>
    <div class="brand-sub">Air Logistics · Facturación y embarque</div>

    <div id="errorBox" class="error-banner"></div>

    <form id="loginForm">
      <div class="field">
        <label for="username">Usuario</label>
        <input type="text" id="username" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <input type="password" id="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn-primary" id="loginBtn" style="width:100%;">Ingresar</button>
    </form>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script>
  const form = document.getElementById("loginForm");
  const errorBox = document.getElementById("errorBox");
  const btn = document.getElementById("loginBtn");

  // Soporta volver a la pantalla que el usuario quería ver (ej. el link
  // de detalle de un correo) después de loguearse: index.html?next=detalle.html%3Fid%3D123
  const next = new URLSearchParams(window.location.search).get("next") || "home.html";

  // Si ya hay sesión activa, no mostrar login de nuevo.
  if (AUTH.getSession()) window.location.href = next;

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    errorBox.classList.remove("show");
    btn.disabled = true;
    btn.textContent = "Ingresando...";
    try {
      await AUTH.login(
        document.getElementById("username").value.trim(),
        document.getElementById("password").value
      );
      window.location.href = next;
    } catch (err) {
      errorBox.textContent = err.message;
      errorBox.classList.add("show");
      btn.disabled = false;
      btn.textContent = "Ingresar";
    }
  });
</script>
</body>
</html>
